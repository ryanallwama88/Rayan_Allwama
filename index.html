<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayan Allwama | Digital Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::selection {
            background: #f59e0b;
            color: #000;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-white">

    <div class="min-h-screen flex flex-col relative">
        
        <main class="flex-grow flex items-center justify-center relative overflow-hidden py-20 px-4">
            
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
                <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-[100px] opacity-50"></div>
                <div class="absolute bottom-1/4 left-1/4 w-80 h-80 bg-red-600/10 rounded-full blur-[100px] opacity-50"></div>
            </div>

            <div class="relative z-20 max-w-2xl w-full text-center space-y-8 animate-fade-in-up">
                
                <div class="space-y-4">
                    <h1 class="text-5xl md:text-7xl font-black tracking-tight">
                        <span class="bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                            Rayan Allwama
                        </span>
                    </h1>
                    <p class="text-lg md:text-xl text-amber-500 font-bold tracking-[0.2em] uppercase">
                        Digital Content Creator
                    </p>
                    <p class="text-slate-400 max-w-sm mx-auto leading-relaxed font-light italic">
                        "Crafting visual stories, one frame at a time."
                    </p>
                </div>

                <div class="flex justify-center py-2">
                    <div class="bg-white/5 backdrop-blur-md px-8 py-3 rounded-full border border-white/10 flex items-center gap-4 group hover:bg-white/10 transition-colors">
                        <div class="bg-red-500/20 p-1.5 rounded-lg">
                            <i data-lucide="video" class="text-red-500 w-5 h-5"></i>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-3xl font-black text-white">6</span>
                            <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Videos</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-4 justify-center items-center w-full max-w-sm mx-auto pt-6">
                    <a 
                        href="https://www.youtube.com/results?search_query=Rayan+Allwama" 
                        target="_blank" 
                        class="w-full flex items-center justify-center gap-4 px-8 py-4 bg-white text-slate-900 rounded-2xl font-black text-lg transition-all transform hover:-translate-y-1.5 shadow-xl hover:shadow-white/10 group"
                    >
                        <i data-lucide="youtube" class="text-red-600"></i>
                        <span>YouTube Channel</span>
                    </a>
                    
                    <div class="w-full">
                        <a 
                            href="https://www.facebook.com/ryan.allwama.2025" 
                            target="_blank" 
                            class="flex items-center justify-center gap-3 px-4 py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl font-bold text-base transition-all transform hover:-translate-y-1 border border-slate-700"
                        >
                            <i data-lucide="facebook" class="text-blue-500"></i>
                            <span>Facebook</span>
                        </a>
                    </div>
                </div>

            </div>
        </main>

        <footer class="w-full py-8 text-center relative z-20">
            <p class="text-slate-600 text-[10px] uppercase tracking-[0.3em] font-bold">
                © 2025 Rayan Allwama • Premier Content
            </p>
        </footer>
    </div>

    <script>
      lucide.createIcons();
    </script>
</body>
</html>
